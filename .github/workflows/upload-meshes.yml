name: Upload meshes to Roblox

# MANUAL ONLY. Never on push: uploading on every commit would fill the account
# with duplicate assets, and there is no bulk delete.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many to upload this run (1 to test, 0 for all remaining)"
        type: string
        default: "1"
      only:
        description: "Optional name filter, e.g. Anchovy"
        type: string
        default: ""

permissions:
  contents: write
  actions: write # to start the CI run that rebuilds and republishes; see below

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      # Full history so the integrity check below can see every id this manifest
      # has ever held — this is the run that creates them, so it is also the run
      # with the most to lose.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # assimp converts the pack's OBJ files to the FBX that Open Cloud wants
      # for Model assets. Far lighter than pulling Blender in for the same job.
      - name: Install assimp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq assimp-utils
          assimp version | head -3

      - name: Install python deps
        run: pip install --quiet requests

      # Fails loudly and early if the key is missing, rather than halfway
      # through a batch. The creators themselves are per-game and default to the
      # two group ids, which are public - see tools/upload-meshes.py.
      - name: Check configuration
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          if [ -z "$ROBLOX_API_KEY" ]; then
            echo "::error::ROBLOX_API_KEY is not set."
            exit 1
          fi
          echo "Key present. Each game uploads under its own group."

      - name: Upload
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          # Only needed to override the defaults baked into upload-meshes.py.
          GEODE_GROUP_ID: ${{ secrets.GEODE_GROUP_ID }}
          REEL_GROUP_ID: ${{ secrets.REEL_GROUP_ID }}
          ROBLOX_USER_ID: ${{ secrets.ROBLOX_USER_ID }}
        run: |
          python3 tools/upload-meshes.py \
            --limit "${{ inputs.limit }}" \
            --only "${{ inputs.only }}"

      # Manifest -> Meshes.luau, then the same checks CI runs, so a bad id can
      # never be committed.
      - name: Generate mesh tables
        run: python3 tools/build-meshes.py

      - name: Validate
        run: |
          python3 tests/check-models.py . games/reel-a-relic games/easy-obby
          # The ids in the working tree are worth real, unrecoverable uploads by
          # this point. Refuse to commit a manifest that has fewer than history
          # already knows about.
          python3 tests/check-manifest.py

      # The ids in this commit are the only record of uploads that already
      # happened and cannot happen again. If the push loses a race with another
      # commit, they die with the runner and those models are stranded on the
      # account — so this rebases and retries rather than failing, and the
      # manifest merge driver is registered first so the rebase resolves the
      # manifest by keeping ids rather than by picking a side.
      - name: Commit asset ids
        id: commit
        run: |
          git add -- assets/mesh-source/asset_manifest.csv \
                     src/shared/Config/Meshes.luau \
                     games/reel-a-relic/src/shared/Config/Meshes.luau
          if git diff --cached --quiet; then
            echo "No new asset ids."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.meshmanifest.name "mesh manifest (asset ids never go backwards)"
          git config merge.meshmanifest.driver "python3 tools/manifest-merge.py %O %A %B %P"
          git commit -m "Upload meshes: record Roblox asset ids"

          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${branch}"; then
              echo "pushed=true" >>"$GITHUB_OUTPUT"
              echo "Pushed."
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/${branch}"
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
            # The rebase must not have cost us anything. If it did, stop here
            # rather than pushing a manifest that is missing paid-for ids.
            python3 tests/check-manifest.py
            sleep $((attempt * 3))
          done
          echo "::error::Could not push the asset ids after 4 attempts. They are in this run's log; do not re-run the upload blindly, it would create duplicate assets."
          exit 1

      # A push made with GITHUB_TOKEN does NOT start a workflow run. GitHub
      # blocks that so workflows cannot trigger each other in a loop, and there
      # is no warning — the commit simply lands and nothing happens.
      #
      # That silently undid the point of the whole run once: 69 meshes uploaded,
      # their ids committed, the config updated, and the place files never
      # rebuilt — so the assets existed, the game referenced them, and the
      # PUBLISHED game had none of it. The manifest said done and the thing
      # players load said otherwise.
      #
      # An explicit workflow_dispatch is exempt from the rule, so ask for the
      # rebuild rather than assuming it happens.
      - name: Rebuild and republish the places
        if: steps.commit.outputs.pushed == 'true'
        run: |
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\",\"inputs\":{\"publish\":\"true\"}}")
          if [ "$code" = "204" ]; then
            echo "CI dispatched; it will rebuild the places and publish them."
          else
            # Not fatal: the ids are safely committed, which is the irreplaceable
            # part. Say plainly what is left to do rather than reporting success.
            echo "::warning title=Republish not started::Asset ids are committed, but CI could not be dispatched (HTTP ${code}). Run the CI workflow manually to rebuild and publish. $(cat /tmp/dispatch.out)"
          fi
