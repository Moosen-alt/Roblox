name: Inspect uploaded assets

# Diagnostic only. Reads asset metadata from Roblox and prints it; uploads
# nothing, commits nothing, changes nothing.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet requests
      - name: What are these ids?
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: python3 tools/inspect-assets.py
