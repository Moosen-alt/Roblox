name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  GAMES: ". games/reel-a-relic games/easy-obby"

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (rojo, luau, luau-lsp)
        run: |
          mkdir -p /tmp/tools && cd /tmp/tools
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.0/rojo-7.7.0-linux-x86_64.zip
          unzip -o rojo.zip
          curl -sSL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          unzip -o luau.zip
          curl -sSL -o luau-lsp.zip https://github.com/JohnnyMorganz/luau-lsp/releases/latest/download/luau-lsp-linux-x86_64.zip
          unzip -o luau-lsp.zip
          curl -sSL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau
          chmod +x rojo luau luau-lsp
          echo "/tmp/tools" >> "$GITHUB_PATH"

      - name: Static analysis (strict Luau, Roblox API definitions, all games)
        run: |
          for dir in $GAMES; do
            echo "=== analyzing $dir ==="
            (cd "$dir" \
              && rojo sourcemap default.project.json -o sourcemap.json \
              && luau-lsp analyze --sourcemap sourcemap.json \
                   --definitions /tmp/tools/globalTypes.d.luau \
                   --ignore "src/server/Packages/**" src)
          done

      - name: Math tests
        run: |
          LUAU=luau sh tests/run.sh
          LUAU=luau sh tests/run.sh games/reel-a-relic tests/invariants.luau

      - name: Build place files
        run: |
          for dir in $GAMES; do
            echo "=== building $dir ==="
            (cd "$dir" && mkdir -p build && rojo build default.project.json -o build/game.rbxlx)
          done

      # Rojo builds are deterministic, so this only fires when src/ actually
      # changed an output. [skip ci] prevents a rebuild loop.
      - name: Commit rebuilt place files
        if: github.event_name == 'push'
        run: |
          git add -- build/game.rbxlx games/*/build/game.rbxlx
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: rebuild place files [skip ci]"
            git push
          else
            echo "Place files unchanged."
          fi

      - name: Upload place file artifacts
        uses: actions/upload-artifact@v4
        with:
          name: place-files
          path: |
            build/game.rbxlx
            games/*/build/game.rbxlx

      # Auto-publish to Roblox via Open Cloud — no Studio needed. Each game
      # publishes only when its secrets are configured (repo Settings ->
      # Secrets and variables -> Actions):
      #   ROBLOX_API_KEY                       - Open Cloud key, universe-places:write
      #   GEODE_UNIVERSE_ID / GEODE_PLACE_ID   - Crack a Geode
      #   REEL_UNIVERSE_ID  / REEL_PLACE_ID    - Reel a Relic
      #   OBBY_UNIVERSE_ID  / OBBY_PLACE_ID    - Easy Obby
      - name: Publish Crack a Geode to Roblox (if configured)
        if: github.event_name == 'push'
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ secrets.GEODE_UNIVERSE_ID }}
          PLACE_ID: ${{ secrets.GEODE_PLACE_ID }}
        run: bash .github/scripts/publish-place.sh build/game.rbxlx

      - name: Publish Reel a Relic to Roblox (if configured)
        if: github.event_name == 'push'
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ secrets.REEL_UNIVERSE_ID }}
          PLACE_ID: ${{ secrets.REEL_PLACE_ID }}
        run: bash .github/scripts/publish-place.sh games/reel-a-relic/build/game.rbxlx

      - name: Publish Easy Obby to Roblox (if configured)
        if: github.event_name == 'push'
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ secrets.OBBY_UNIVERSE_ID }}
          PLACE_ID: ${{ secrets.OBBY_PLACE_ID }}
        run: bash .github/scripts/publish-place.sh games/easy-obby/build/game.rbxlx
